# Раздача собранного SPA (кабинет или админка). HTTPS обычно завершается на внешнем
# прокси (Caddy, Traefik, nginx на хосте) — Telegram открывает Mini App только по https.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Заголовки повторены в каждом location: в nginx add_header внутри location
    # отменяет заголовки уровня server.
    # X-Frame-Options не ставим: Telegram Web открывает Mini App во фрейме.

    # файлы сборки с хэшем в имени — кэш навсегда
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # анимации эмодзи (имена без хэша — кэш на неделю)
    location ~ ^/emoji(-original)?/ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # остальное — маршруты приложения; index.html не кэшируем, чтобы после релиза сразу подтянулась новая сборка
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
