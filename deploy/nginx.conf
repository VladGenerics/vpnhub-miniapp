# Отдаёт собранное приложение. HTTPS - на внешнем прокси (Caddy, Traefik, nginx на хосте),
# Telegram открывает Mini App только по https.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # .lottie уходит как application/octet-stream: это уже zip, gzip поверх не нужен

    # add_header в location отменяет заголовки уровня server, поэтому они повторены в каждом.
    # X-Frame-Options не ставим: Telegram Web открывает Mini App во фрейме.
    # Вместо него frame-ancestors: встраивать страницу можно только самому сайту и Telegram Web.

    # файлы с хэшем в имени - кэш навсегда
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # эмодзи без хэша в имени - кэш на неделю
    location ~ ^/emoji(-original|-mono)?/ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # /api сюда доходит, только если внешний прокси не отправил его на бэкенд (VITE_API_URL=/api).
    # Без этого блока вместо ошибки вернулся бы index.html, и приложение висело бы на загрузке.
    # Можно и проксировать прямо отсюда: proxy_pass http://backend:8000; (backend - имя сервиса в compose)
    location /api/ {
        default_type application/json;
        return 502 '{"detail":"API не подключено: настройте прокси /api на бэкенд"}';
    }

    # всё остальное - маршруты SPA. index.html не кэшируем, чтобы после релиза сразу подтянулась новая версия
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
        try_files $uri $uri/ /index.html;
    }
}
